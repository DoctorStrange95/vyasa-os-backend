services:
  - type: web
    name: vyasa-backend
    env: node
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      # ── Secrets — set these in the Render dashboard, never commit values ──
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: SUPERADMIN_EMAIL
        sync: false
      - key: SUPERADMIN_PASSWORD
        sync: false
      # ── Optional: Email + WhatsApp ──
      - key: BREVO_API_KEY
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_ID
        sync: false
      # ── CORS origin ──
      - key: CLIENT_ORIGIN
        value: https://app.vyasaa.com
